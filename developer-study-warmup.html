<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer study · Counter warm-up</title>
    <style>
      body { margin: 0; padding: 32px; color: #17211c; background: #f2f4f0; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 760px; margin: auto; }
      h1 { margin-bottom: 8px; font-size: 30px; }
      p { color: #58655d; }
      .panel { margin-top: 18px; padding: 18px; background: white; border-radius: 8px; }
      output { display: block; margin-bottom: 12px; font-size: 32px; font-variant-numeric: tabular-nums; }
      button { margin-right: 8px; border: 0; border-radius: 6px; padding: 10px 14px; color: white; background: #185d42; font: inherit; cursor: pointer; }
      #check { margin-top: 16px; background: #25334b; }
      #result { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #fff; border-radius: 8px; }
      #result[data-status="PASS"] { border-left: 4px solid #168653; }
      #result[data-status="FAIL"] { border-left: 4px solid #bb3c37; }
      body[data-arm="react"] .arm-label::after { content: "React 19.3 + React Compiler"; }
      body[data-arm="runtime"] .arm-label::after { content: "OXC + retained VDOM runtime"; }
      .timebox { color: #79867f; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <p class="arm-label">ARM · </p>
      <h1>Ten-minute counter warm-up</h1>
      <p id="instructions"></p>
      <p class="timebox">Timebox: 10 minutes. This unrelated exercise is unscored and uses the same counter contract in both arms.</p>
      <section class="panel">
        <div id="counter"></div>
        <button id="check" type="button">Run warm-up checks</button>
      </section>
      <pre id="result" data-status="READY" aria-live="polite">Add decrement and reset, then run the checks.</pre>
    </main>
    <script type="module" src="/src/developer_study/warmup_browser.ts"></script>
  </body>
</html>
