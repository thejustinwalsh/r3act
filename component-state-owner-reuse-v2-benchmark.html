<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyed owner token reuse · Runtime study</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem; color: #17201d; }
      #result { white-space: pre-wrap; overflow-wrap: anywhere; }
      .pass { color: #087443; }
      .fail { color: #b42318; }
      .roots { position: fixed; left: -200vw; top: 0; opacity: 0; pointer-events: none; contain: layout; }
      button { margin-right: .75rem; }
    </style>
  </head>
  <body>
    <h1>Keyed owner reuse: token follow-up</h1>
    <p>Same 10,000-row fixture, ComponentStateRoot, and retained VDOM. Four arms compare generic expansion, V1 checked reuse, V2 token reuse, and React + Compiler.</p>
    <label>Seed <input id="seed" type="number" value="83005101" min="1" max="4294967295" step="1"></label>
    <button id="run" type="button">Run study</button>
    <button id="export" type="button" disabled>Export JSON</button>
    <pre id="result">Ready.</pre>
    <details><summary>Latest raw record</summary><pre id="record">Run the study to populate samples and checks.</pre></details>
    <div class="roots">
      <div id="react-root"></div>
      <div id="generic-root"></div>
      <div id="reuse-root"></div>
      <div id="token-root"></div>
    </div>
    <script type="module" src="/src/browser/component_state_owner_reuse_v2_benchmark.tsx"></script>
  </body>
</html>
