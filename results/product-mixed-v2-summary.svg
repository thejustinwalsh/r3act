<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" role="img" aria-labelledby="title desc">
<title id="title">Product mixed V2 paired ratios</title><desc id="desc">Native over React ratios by row count; lower is faster. Axis expands to show every resolved ratio. Coarse-denominator results are marked unresolved.</desc>
<style>
text{font-family:system-ui,-apple-system,sans-serif;fill:#182230}.panel-title{font-size:15px;font-weight:650}.tick{font-size:12px;fill:#5b6675}.value{font-size:12px;font-weight:600}.grid{stroke:#d8dee7;stroke-width:1}.threshold{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4}.threshold-label{font-size:11px;fill:#b42318}.bar{rx:4}.pass{fill:#238636}.fail{fill:#d04437}.unresolved{fill:#aab4c0;rx:4}
</style>
<rect width="100%" height="100%" fill="#fff"/><text x="35" y="482" class="tick">Gate: FAIL · ratio = native/React (lower is faster)</text><text x="35" y="502" class="tick">Unresolved when React denominator ≤ 0.500 ms (5 × 0.100 ms calibrated clock tick); resolved ratios alone determine thresholds.</text>
