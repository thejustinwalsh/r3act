<text x="405" y="209.63902185697538" text-anchor="middle" class="value">1.767</text>
<text x="405" y="438" text-anchor="middle" class="tick">1024 rows</text>
<text x="545" y="36" class="panel-title">Median paired page p95 ratio</text>
<line x1="545" x2="965" y1="412" y2="412" class="grid"/>
<text x="535" y="416" text-anchor="end" class="tick">0.0</text>
<line x1="545" x2="965" y1="302" y2="302" class="grid"/>
<text x="535" y="306" text-anchor="end" class="tick">1.0</text>
