<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" role="img" aria-labelledby="title desc">
<title id="title">Product mixed native cell-cut confirmation ratios</title><desc id="desc">Native over React ratios by row count; lower is faster. Axis expands to show every resolved ratio. Denominators below the conservative pair-specific clock floor are marked unresolved.</desc>
<style>
text{font-family:system-ui,-apple-system,sans-serif;fill:#182230}.panel-title{font-size:15px;font-weight:650}.tick{font-size:12px;fill:#5b6675}.value{font-size:12px;font-weight:600}.grid{stroke:#d8dee7;stroke-width:1}.threshold{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4}.threshold-label{font-size:11px;fill:#b42318}.bar{rx:4}.pass{fill:#238636}.fail{fill:#d04437}.unresolved{fill:#aab4c0;rx:4}
</style>
<rect width="100%" height="100%" fill="#fff"/><text x="35" y="482" class="tick">Gate: FAIL · ratio = native/React (lower is faster)</text><text x="35" y="502" class="tick">Pair floor = 5 × max(prereg clock 0.005000 ms, both page clocks); unresolved pairs receive no ratio.</text>
<text x="70" y="36" class="panel-title">Paired geometric mean of page median ratios</text>
<line x1="70" x2="490" y1="412" y2="412" class="grid"/>
<text x="60" y="416" text-anchor="end" class="tick">0.0</text>
<line x1="70" x2="490" y1="302" y2="302" class="grid"/>
<text x="60" y="306" text-anchor="end" class="tick">1.0</text>
<line x1="70" x2="490" y1="192" y2="192" class="grid"/>
<text x="60" y="196" text-anchor="end" class="tick">2.0</text>
<line x1="70" x2="490" y1="82" y2="82" class="grid"/>
<text x="60" y="86" text-anchor="end" class="tick">3.0</text>
<line x1="70" x2="490" y1="324" y2="324" class="threshold"/>
<text x="488" y="318" text-anchor="end" class="threshold-label">limit 0.8</text>
<rect x="121" y="223.58135246885075" width="48" height="188.41864753114925" class="bar fail"/>
<text x="145" y="215.58135246885075" text-anchor="middle" class="value">1.713</text>
<text x="145" y="438" text-anchor="middle" class="tick">128 rows</text>
