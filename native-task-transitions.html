<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10191b" />
    <title>Native task transitions</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7eeeb;background:#10191b;font-synthesis:none;text-rendering:optimizeLegibility;--muted:#91a4a0;--line:#2b3a3b;--panel:#172224;--mint:#b8efc9;--teal:#69c9ae;--amber:#e2b66f;--rose:#ef9d92}
      *{box-sizing:border-box}body{margin:0;min-width:360px;background:radial-gradient(ellipse at 12% 0%,#213334 0,transparent 43%),#10191b;color:#e7eeeb}button,input{font:inherit}button{color:inherit}.workbench{max-width:1440px;margin:auto;padding:48px clamp(18px,4vw,64px) 32px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding:18px 0 34px;border-bottom:1px solid var(--line)}.eyebrow{display:block;color:#8db6a4;font-size:10px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(38px,5.2vw,68px);line-height:1.03;letter-spacing:-.055em;margin:15px 0 16px;font-weight:650}.hero h1 em{color:var(--mint);font-style:normal}.hero p{max-width:690px;margin:0;color:#aab9b4;line-height:1.65;font-size:14px}.hero-stat{border:1px solid #3b514b;background:#192624;border-radius:14px;padding:18px 22px;min-width:134px}.hero-stat span,.hero-stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em}.hero-stat strong{display:block;color:var(--mint);font-size:34px;margin:7px 0 3px}.control-strip{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}.control-copy strong,.control-copy small{display:block}.control-copy strong{font-size:13px;margin:7px 0 4px}.control-copy small{color:var(--muted);font-size:11px}.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row button{border:1px solid #40514d;border-radius:9px;background:#243330;padding:10px 13px;font-size:12px;font-weight:700;cursor:pointer}.button-row button:hover{border-color:#8ed7b0;background:#2d423b}.button-row button small{display:block;color:#a9c2b4;font-size:9px;font-weight:500;margin-top:3px}.button-row .quiet-button{background:transparent;color:#c5d2cc}.button-row button:disabled,.row-cancel:disabled{opacity:.35;cursor:default}.roots-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 0}.root-surface{height:100%;min-height:470px;padding:19px;border:1px solid #304241;border-radius:15px;background:linear-gradient(145deg,#192627,#151f21);box-shadow:0 16px 48px #0002}.root-heading,.section-head,.feed-title,.result-top{display:flex;align-items:center;justify-content:space-between}.root-heading h2{font-size:18px;letter-spacing:-.02em;margin:5px 0 0}.projected-request{display:block;color:#80978d;font-size:9px;letter-spacing:.015em;margin-top:5px}.root-live,.ready-dot{font-size:9px;letter-spacing:.12em;color:var(--mint);border:1px solid #406355;background:#1b3028;border-radius:20px;padding:5px 8px}.interactive-row{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-top:18px}.interactive-row label,.draft-row label{display:grid;gap:6px;color:#8ea49b;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.interactive-row input,.draft-row input{width:100%;border:1px solid #344746;border-radius:8px;padding:9px 10px;background:#111b1d;color:#e7eeeb;outline:none;font-size:12px;letter-spacing:normal;text-transform:none}.interactive-row input:focus,.draft-row input:focus{border-color:#6dbf9c}.score{display:grid;gap:6px;color:#8ea49b;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.score button{min-width:104px;border:1px solid #51684f;background:#293b2e;color:#d5f2d7;border-radius:8px;padding:9px;cursor:pointer;font-size:12px;font-weight:700}.draft-row{display:flex;align-items:end;gap:12px;margin-top:12px}.draft-row label{flex:1}.draft-row>span{color:#748984;font-size:10px;padding-bottom:10px}.boundary-label{display:flex;justify-content:space-between;margin:19px 0 8px;color:#82a39a;font-size:9px;letter-spacing:.13em;font-weight:800}.boundary-label span+span{color:#b59b68}.fallback-card,.result-card,.error-card{min-height:132px;border:1px solid #324542;border-radius:11px;background:#1d2b2a;padding:15px;display:flex;align-items:center;gap:12px}.fallback-card strong,.fallback-card span{display:block}.fallback-card strong{font-size:12px}.fallback-card span{font-size:10px;color:#90a39d;margin-top:5px}.fallback-card.idle{background:#182425;border-style:dashed}.idle-mark{font-size:24px;color:#70a98c;width:28px;text-align:center}.spinner{width:21px;height:21px;border:2px solid #446354;border-top-color:var(--mint);border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-card{display:block;background:linear-gradient(130deg,#21352e,#1a2928);border-color:#456356}.result-card h3{font-size:17px;letter-spacing:-.02em;margin:15px 0 9px}.result-card p,.feed-card p{font-size:11px;color:#a9b9b2;margin:5px 0}.result-card small,.feed-card small{color:#81958e;font-size:9px}.hit-count{display:flex;align-items:baseline;gap:9px;margin:13px 0 8px}.hit-count strong{color:var(--mint);font-size:25px}.hit-count span{color:#9aafa4;font-size:10px}.error-card{display:block;border-color:#65443f;background:#30221f}.error-card p{color:#f0c4bb;font-size:12px}.error-card small{color:#c2958b;font-size:10px}.feed-card{margin-top:11px;border:1px solid #293b3a;border-radius:10px;background:#151f20;padding:12px 14px}.feed-title{color:#9bb9a7}.like-count{color:#eaa99e;font-size:12px;font-weight:700}.feed-card p{margin:8px 0 4px}.root-foot{display:flex;justify-content:space-between;color:#647873;font-size:9px;margin-top:11px}.ledger{border-top:1px solid var(--line);padding-top:24px}.section-head{margin-bottom:13px}.section-head h2{font-size:20px;letter-spacing:-.03em;margin:6px 0 0}.pulse{color:#83a794;font-size:9px;letter-spacing:.14em}.ledger-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:13px}.ledger-panel{border:1px solid #2b3b3a;border-radius:12px;background:#151f20;padding:14px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:11px;border-bottom:1px solid #2a3938}.panel-head strong{font-size:12px}.panel-head span{color:#91a89c;font-size:10px}.operation-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #253332}.operation-row:last-child{border-bottom:0}.operation-row strong,.operation-row small{display:block}.operation-row strong,.provider-row strong{font-size:10px}.operation-row small,.provider-row small{color:#748984;font-size:9px;margin-top:4px;overflow-wrap:anywhere}.operation-row .task-line{color:#93aaa0;line-height:1.45}.status-pill{min-width:68px;text-align:center;border:1px solid #4c664f;border-radius:7px;padding:5px 7px;color:#b8efc9;font-size:9px}.status-pill small{display:block;color:#91a89c;font-size:8px;margin-top:3px}.status-pill.pending{color:#e5c27c;border-color:#625337}.status-pill.cancelled,.status-pill.failed{color:#efa89c;border-color:#69463f}.row-cancel{border:1px solid #40504e;background:transparent;border-radius:6px;padding:6px 8px;color:#9eaea8;font-size:9px;cursor:pointer}.provider-list{max-height:240px;overflow:auto}.provider-row{display:grid;grid-template-columns:7px 1fr auto;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #253332}.provider-row>span:last-child{color:#859990;font-size:9px}.provider-dot{width:6px;height:6px;border-radius:50%;background:#61736d}.provider-dot.active{background:var(--amber);box-shadow:0 0 9px #e2b66f80}.ownership-note{margin-top:13px;border-radius:8px;background:#202d29;padding:11px}.ownership-note b{font-size:10px;color:#b9d9bf}.ownership-note p{font-size:9px;color:#91a69d;line-height:1.55;margin:5px 0 0}.footer{display:flex;justify-content:space-between;gap:15px;color:#647873;font-size:9px;padding-top:18px}.footer span:last-child{text-align:right}
      @media(max-width:900px){.control-strip{align-items:flex-start;flex-direction:column}.roots-grid,.ledger-grid{grid-template-columns:1fr}.root-surface{min-height:0}.hero{align-items:flex-start}.footer{flex-direction:column}.footer span:last-child{text-align:left}}
      @media(max-width:560px){.workbench{padding-top:25px}.hero-stat{min-width:85px;padding:12px}.hero-stat small{font-size:8px}.interactive-row{grid-template-columns:1fr}.draft-row{align-items:stretch;flex-direction:column}.draft-row>span{padding-bottom:0}.operation-row{grid-template-columns:minmax(0,1fr) auto}.row-cancel{grid-column:2;grid-row:1}.status-pill{grid-column:2;grid-row:2}}
    </style>
    <style>
      .retry-button{margin-top:10px;border:1px solid #77574c;border-radius:7px;background:#452d28;color:#f0c4bb;padding:7px 10px;font-size:10px;cursor:pointer}.retry-button:hover{background:#593a33}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/browser/native_task_transitions.tsx"></script>
  </body>
</html>
