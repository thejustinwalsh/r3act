name: Native package portability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin
          - id: linux-x64-gnu
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - id: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      R3ACT_SOURCE_COMMIT: ${{ github.sha }}
      R3ACT_EVIDENCE_DIR: ${{ runner.temp }}/r3act-native-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Pin pnpm and Rust
        shell: bash
        run: |
          npm install --global pnpm@11.25.0
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup override set 1.97.1
      - name: Record and assert actual runner identity
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          node --version
          pnpm --version
          deno --version
          rustc -vV
          cargo --version
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { execFileSync } from "node:child_process";
            import { writeFileSync } from "node:fs";
            const rustc = execFileSync("rustc", ["-vV"], { encoding: "utf8" });
            const host = /^host: (.+)$/m.exec(rustc)?.[1];
            assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
            assert.equal(process.arch, process.env.EXPECTED_ARCH);
            assert.equal(host, process.env.EXPECTED_RUST_TARGET);
            writeFileSync(process.env.RUNNER_TEMP + "/native-platform-preflight-${{ matrix.id }}.json",
              JSON.stringify({ schemaVersion: 1, sourceCommit: process.env.R3ACT_SOURCE_COMMIT,
                runner: "${{ matrix.runner }}", platform: process.platform, arch: process.arch,
                rustTarget: host, rustc, node: process.version,
                pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
                deno: execFileSync("deno", ["--version"], { encoding: "utf8" }).trim() }, null, 2) + "\n");
          '
      - name: Build and verify native package on this runner
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set +e
          node scripts/verify_native_platform.mjs \
            --output-dir "$R3ACT_EVIDENCE_DIR" \
            --expected-platform "$EXPECTED_PLATFORM" \
            --expected-arch "$EXPECTED_ARCH" \
            --execution-kind github-hosted \
            > "$RUNNER_TEMP/native-platform-${{ matrix.id }}.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/native-platform-${{ matrix.id }}.log"
          exit "$status"
      - name: Preserve native-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-platform-${{ matrix.id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r3act-native-${{ matrix.id }}
            ${{ runner.temp }}/native-platform-${{ matrix.id }}.log
            ${{ runner.temp }}/native-platform-preflight-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30
