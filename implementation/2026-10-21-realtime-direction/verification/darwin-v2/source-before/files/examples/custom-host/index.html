<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native custom canvas host</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #26384f; margin: 2rem; }
      #app { display: grid; grid-template-columns: minmax(12rem, 18rem) minmax(16rem, 24rem); gap: 1rem; }
      canvas { border: 1px solid #b8c8da; border-radius: 0.4rem; }
    </style>
  </head>
  <body>
    <h1>Custom Canvas host</h1>
    <p>Three native roots share a Store. The Canvas host owns its retained handles and brush resources.</p>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
