<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner reuse V3 browser follow-up</title>
    <style>
      body {
        font: 14px/1.5 ui-monospace, monospace;
        margin: 2rem;
        color: #17201d;
      }
      #result {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .pass {
        color: #087443;
      }
      .fail {
        color: #b42318;
      }
      .roots {
        position: fixed;
        left: -200vw;
        top: 0;
        opacity: 0;
        pointer-events: none;
        contain: layout;
      }
    </style>
  </head>
  <body>
    <h1>Keyed owner reuse: V3 browser follow-up</h1>
    <p>
      Production comparison for edge replacement followed by same-key rotation.
      The React arm is compiled by React Compiler in this build.
    </p>
    <label>Seed <input
        id="seed"
        type="number"
        value="83005301"
        min="1"
        max="4294967295"
        step="1"
      ></label>
    <button id="run" type="button">Run page replication</button>
    <button id="export" type="button" disabled>Export JSON</button>
    <pre id="result">Ready.</pre>
    <details>
      <summary>Latest raw record</summary>
      <pre id="record">Run the page to populate samples and checks.</pre>
    </details>
    <div class="roots">
      <div id="react-root"></div>
      <div id="generic-root"></div>
      <div id="token-root"></div>
      <div id="delta-root"></div>
    </div>
    <script
      type="module"
      src="/src/browser/component_state_owner_reuse_v3_browser_benchmark.tsx"
    ></script>
  </body>
</html>
