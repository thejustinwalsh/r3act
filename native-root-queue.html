<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <title>Native root work queue</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101820;
        color: #e9f1f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      main { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(260px, .82fr); gap: 16px; width: min(1450px, calc(100% - 40px)); margin: 0 auto; padding: 40px 0 28px; align-items: start; }
      #app { min-width: 0; }
      .workbench { display: grid; gap: 16px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(28px, 3.2vw, 38px); line-height: 1.12; letter-spacing: -.035em; font-weight: 620; }
      h2 { font-size: 16px; line-height: 1.3; letter-spacing: -.015em; font-weight: 590; }
      .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 2px; }
      .eyebrow { color: #8ea4af; font-size: 10px; line-height: 1.4; font-weight: 700; letter-spacing: .12em; }
      .page-heading .eyebrow { margin-bottom: 7px; }
      .version-tag { padding: 5px 8px; border: 1px solid #2a3b45; border-radius: 5px; color: #a8bac2; font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
      .version-tag b { color: #77d5bd; font-weight: 500; }
      .lede { color: #9eb1bb; max-width: 710px; font-size: 13px; }
      .main-layout { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(260px, .82fr); gap: 16px; align-items: start; margin-top: 4px; }
      .main-column, .control-rail { display: grid; gap: 12px; min-width: 0; }
      .root-panel, .ledger-panel, .batch-card, .semantics-card { min-width: 0; border: 1px solid #2a3b45; border-radius: 9px; background: #17232c; }
      .root-panel { padding: 18px; }
      .fork-panel { margin-top: 0; }
      .panel-heading { display: flex; justify-content: space-between; align-items: start; gap: 14px; }
      .panel-heading .eyebrow { margin-bottom: 4px; }
      .root-state { color: #728892; font-weight: 500; letter-spacing: .04em; }
      .root-chip, .count-chip { flex: none; padding: 3px 7px; border: 1px solid #34505b; border-radius: 5px; color: #91dcca; background: #1a3036; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .count-chip { color: #9eb1bb; border-color: #34444b; background: #1b2931; }
      .value-line { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 11px; margin-top: 12px; border-top: 1px solid #263842; border-bottom: 1px solid #263842; color: #9eb1bb; font-size: 12px; }
      .value-line output { color: #bff1e4; font: 650 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
      .fork-value-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 9px; border-bottom: 1px solid #263842; color: #8fa5af; font-size: 11px; }
      .fork-value-line output { color: #a8c8d0; font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
      .draft-label { display: grid; gap: 5px; margin-top: 12px; color: #9eb1bb; font-size: 11px; }
      input { width: 100%; min-width: 0; height: 40px; padding: 0 10px; color: #e9f1f4; background: #111b23; border: 1px solid #30444e; border-radius: 6px; font: inherit; }
      input:hover { border-color: #46616d; }
      input:focus-visible, button:focus-visible { outline: 2px solid #77d5bd; outline-offset: 2px; }
      .root-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      button { min-height: 44px; padding: 0 12px; border: 1px solid #3a5663; border-radius: 6px; color: #e9f1f4; background: #263b46; font: inherit; font-size: 12px; line-height: 1.2; font-weight: 600; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease; }
      button:hover { background: #304b58; border-color: #50717f; }
      .urgent-button { min-width: 96px; }
      .scope-note { color: #81969f; font-size: 10px; }
      .pending-note { margin-top: 11px; color: #8fa5af; font-size: 11px; line-height: 1.5; }
      .ledger-panel { padding: 16px; }
      .ledger-intro { margin-top: 8px; color: #8fa5af; font-size: 11px; line-height: 1.45; }
      .empty-ledger { display: flex; align-items: center; gap: 10px; min-height: 76px; margin-top: 12px; padding: 12px; border: 1px dashed #34464f; border-radius: 6px; color: #879ba4; font-size: 11px; }
      .empty-mark { color: #77d5bd; font: 18px/1 ui-monospace, monospace; }
      .operation-list { display: grid; gap: 7px; margin-top: 12px; }
      .operation { min-width: 0; padding: 10px 10px 8px; border: 1px solid #3b3d36; border-left: 3px solid #b58c4f; border-radius: 6px; background: #1b272e; }
      .operation.is-ready { border-color: #315148; border-left-color: #77d5bd; }
      .operation.is-cancelled { border-color: #35444a; border-left-color: #60747b; }
      .operation-topline, .operation-meta, .operation-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .operation-name { min-width: 0; color: #dce7ea; font-size: 11px; font-weight: 580; }
      .operation-status { flex: none; color: #d2ad76; font-size: 10px; }
      .is-ready .operation-status { color: #8bd7c3; }
      .is-cancelled .operation-status { color: #93a3a9; }
      .operation-meta { margin-top: 3px; color: #8297a0; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      progress { display: block; width: 100%; height: 4px; margin: 8px 0 5px; overflow: hidden; border: 0; border-radius: 4px; background: #303d41; accent-color: #bf9454; }
      progress::-webkit-progress-bar { border-radius: 4px; background: #303d41; }
      progress::-webkit-progress-value { border-radius: 4px; background: #bf9454; }
      progress::-moz-progress-bar { border-radius: 4px; background: #bf9454; }
      .is-ready progress { accent-color: #77d5bd; }
      .is-ready progress::-webkit-progress-value { background: #77d5bd; }
      .is-ready progress::-moz-progress-bar { background: #77d5bd; }
      .operation-foot { min-height: 24px; color: #80949c; font-size: 10px; }
      .cancel-button { min-height: 44px; padding: 0 8px; border-color: #40515a; color: #a7b4b9; background: #202e35; font-size: 10px; }
      .cancel-explainer { margin-top: 5px; color: #93a3a9; font-size: 10px; }
      .ledger-footer { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #293a43; }
      .legend { display: flex; align-items: center; gap: 6px; color: #8fa2aa; font-size: 10px; }
      .legend i { width: 7px; height: 7px; border-radius: 50%; background: #77d5bd; }
      .legend .legend-pending { background: #b58c4f; }
      .signature-note { margin-top: 11px; color: #8399a2; font-size: 10px; line-height: 1.5; }
      .signature-note strong { color: #b7c8ce; font-weight: 600; }
      .batch-card, .semantics-card { padding: 16px; }
      .batch-card h2 { margin-top: 5px; }
      .batch-card > p:not(.eyebrow) { margin-top: 7px; color: #8fa5af; font-size: 11px; line-height: 1.5; }
      .start-button { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 13px; color: #10201e; background: #77d5bd; border-color: #77d5bd; }
      .start-button:hover { color: #10201e; background: #91e3ce; border-color: #91e3ce; }
      .start-button span { font-size: 15px; }
      .batch-specs { display: grid; grid-template-columns: 1fr; gap: 5px; margin-top: 11px; color: #8fa5af; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .batch-specs span::before { content: "— "; color: #506a73; }
      .semantics-card .eyebrow { margin-bottom: 10px; }
      .semantic-row { display: grid; grid-template-columns: 8px 1fr; align-items: start; gap: 9px; padding: 9px 0; border-top: 1px solid #293a43; }
      .semantic-row p { color: #8fa2aa; font-size: 10px; line-height: 1.45; }
      .semantic-row strong { color: #d3dfe2; font-size: 11px; font-weight: 600; }
      .semantic-dot { width: 7px; height: 7px; margin-top: 4px; border-radius: 50%; }
      .semantic-dot.mint { background: #77d5bd; }
      .semantic-dot.amber { background: #b58c4f; }
      .semantic-dot.slate { background: #71858c; }
      .page-footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 5px; color: #71858e; font-size: 10px; }
      #fork-app { min-width: 0; margin-top: 102px; }
      .fork-panel { margin-top: 0; }
      @media (max-width: 820px) {
        main { display: grid; grid-template-columns: 1fr; width: min(100% - 28px, 620px); padding-top: 26px; }
        .main-layout { grid-template-columns: 1fr; }
        #fork-app { margin-top: 0; }
        .page-footer { flex-direction: column; gap: 4px; }
      }
      @media (max-width: 520px) {
        main { width: calc(100% - 24px); }
        .page-heading { align-items: start; flex-direction: column; }
        .root-panel, .ledger-panel, .batch-card, .semantics-card { padding: 13px; }
        .operation-topline { align-items: start; flex-direction: column; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="app"></div>
      <div id="fork-app" aria-label="Fork root projection"></div>
    </main>
    <script type="module" src="/src/browser/native_root_queue.tsx"></script>
  </body>
</html>
